name: 模块1-需求分析
description: 分析用户需求，输出结构化分析报告
version: 1.0.0

module:
  path: ..\模块1-需求分析.md
  role: 视频脚本策划分析师

input:
  - name: UserInput
    type: string
    required: true
    description: 用户的原始需求输入

output:
  - name: 分析报告
    type: file
    description: 结构化的需求分析报告
    required: true

processing:
  format: markdown
  output_template: |
    ===== 焚诀·需求分析报告 =====

    【视频类型】{视频类型}
    【内容风格】{内容风格}
    【核心看点】{核心看点}
    【画面类型】{画面类型}
    【画面比例】{画面比例}
    【生成工具】{生成工具}

    【角色清单】
    {角色清单}

    【场景清单】
    {场景清单}

    【关键道具】
    {关键道具}

    【时长规划】
    总时长：{总时长}
    总段数：{总段数}段
    单段时长范围：{单段时长范围}
    时长说明：{时长说明}

    【核心冲突】{核心冲突}
    【情绪基调】{情绪基调}

    ===== 分析完毕，请确认后进入大纲生成 =====

rules:
  - 全程使用中文输出
  - 不生成任何脚本、分镜、提示词内容
  - 不输出分析过程，只输出结果
  - 不使用表格，全部使用纯文本
