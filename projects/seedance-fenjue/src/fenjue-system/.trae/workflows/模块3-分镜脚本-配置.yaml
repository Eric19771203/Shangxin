name: 模块3-分镜脚本生成
description: 根据全片大纲和需求分析，生成可直接使用的分镜脚本
version: 1.0.0

module:
  path: ..\模块3-分镜脚本生成.md
  role: AI视频分镜脚本师

input:
  - name: 需求分析报告
    type: file
    required: true
    source: 模块1
    description: 模块1输出的需求分析报告
  - name: 大纲文件
    type: file
    required: true
    source: 模块2
    description: 模块2输出的大纲与节奏规划

output:
  - name: 分镜脚本
    type: file
    description: 可直接复制到即梦AI使用的完整分镜脚本
    required: true

processing:
  format: markdown
  output_template: |
    ===== 焚诀·分镜脚本 =====

    【视频类型】{视频类型}
    【风格】{风格}
    【总时长】{总时长}
    【共{总段数}段】
    【画面类型】{画面类型}
    【画面比例】{画面比例}
    【生成工具】{生成工具}

    =====================================
    【角色表】
    {角色表}
    =====================================

    {分段脚本}

    ===== 全片生成完毕 =====

    【全片自检】
    角色一致性：{角色一致性}
    空间连贯性：{空间连贯性}
    运镜规范：{运镜规范}
    时长合规：{时长合规}
    颗粒度匹配：{颗粒度匹配}
    合规检查：{合规检查}
    情绪执行：{情绪执行}

rules:
  - 角色表中每个角色的外形描述全片一字不改
  - 每一段只使用1种核心运镜方式
  - 同一场景内人物位置关系必须前后连贯
  - 每段时长不超过15秒，不低于3秒
  - 全程不加字幕、不加时间码、不加水印、不加logo
  - 禁用词必须替换

batch_rules:
  - 如果总段数超过5段，分批生成
  - 每批不超过5段
  - 批次切割点在情绪强度≤2的段落之后
