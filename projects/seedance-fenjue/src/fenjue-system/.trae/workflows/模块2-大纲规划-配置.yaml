name: 模块2-大纲与节奏规划
description: 根据需求分析报告，规划全片的叙事结构和情绪节奏
version: 1.0.0

module:
  path: ..\模块2-大纲与节奏规划.md
  role: 视频节奏设计师

input:
  - name: 需求分析报告
    type: file
    required: true
    source: 模块1
    description: 模块1输出的需求分析报告

output:
  - name: 大纲文件
    type: file
    description: 可执行的分段大纲文件
    required: true

processing:
  format: markdown
  output_template: |
    ===== 焚诀·全片大纲 =====

    【叙事结构】{叙事结构}
    【总时长】{总时长}
    【情绪曲线概览】{情绪曲线概览}

    ---

    {段落详情}

    ---

    【节奏自检】
    情绪曲线：{情绪曲线}
    峰值位置：{峰值位置}
    连续高强：{连续高强}
    连续低迷：{连续低迷}
    开场强度：{开场强度}
    结尾强度：{结尾强度}
    情感钩子：{情感钩子}

    ===== 大纲完毕，请确认后进入分镜脚本生成 =====

rules:
  - 全程使用中文输出
  - 不生成具体画面描写、运镜、台词内容
  - 不使用表格，全部使用纯文本
  - 节奏自检必须全部通过才能输出

self_check:
  - 禁止冷启动：第1段情绪强度≥2
  - 禁止连续高强：不能连续超过3段情绪强度≥4
  - 禁止连续低迷：不能连续超过3段情绪强度≤2
  - 必须有峰值：全片至少出现1次情绪强度5级
  - 峰值位置：全片最高潮应出现在后半段（50%-85%位置）
  - 结尾回落：最后一段情绪强度应≤3
  - 有起有落：全片情绪曲线至少形成1个完整的「升→顶→落」波形
