name: 模块4-资产详情生成
description: 根据需求分析和分镜脚本，生成角色、场景、道具的详细视觉描述
version: 1.0.0

module:
  path: ..\模块4-独立功能-资产详情生成.md
  role: 视觉资产描述师

input:
  - name: 需求分析报告
    type: file
    required: true
    source: 模块1
    description: 模块1输出的需求分析报告
  - name: 分镜脚本
    type: file
    required: true
    source: 模块3
    description: 模块3输出的分镜脚本

output:
  - name: 资产详情
    type: file
    description: 角色、场景、道具的详细视觉描述文档
    required: true

processing:
  format: markdown
  output_template: |
    ===== 焚诀·资产详情 =====

    --- 角色详情 ---
    {角色详情}

    --- 场景详情 ---
    {场景详情}

    --- 道具详情 ---
    {道具详情}

    ===== 资产详情完毕 =====

asset_types:
  - name: 角色详情
    output_format: |
      【角色名：{角色名}（{角色定位}）】

      面部与体型：
      {面部与体型描述}

      服装分层：
      {服装分层描述}

      武器与随身道具：
      {武器与随身道具描述}

      气质与标志性动态：
      {气质与标志性动态描述}

      形态变化表：
      {形态变化表}
    word_count: 约500字/角色

  - name: 场景详情
    output_format: |
      【场景名：{场景名}】

      空间定性：
      {空间定性描述}

      环境细节：
      {环境细节描述}

      光线与色调：
      {光线与色调描述}

      氛围关键词：
      {氛围关键词}
    word_count: 约300字/场景

  - name: 道具详情
    output_format: |
      【道具名：{道具名} | 所属角色：{所属角色}】

      基础外观：
      {基础外观描述}

      特殊效果：
      {特殊效果描述}

      使用状态：
      {使用状态描述}
    word_count: 约200字/道具

rules:
  - 所有描述必须是视觉可呈现的具体内容
  - 颜色描述要具体（如深靛蓝、冰蓝色，不写蓝色）
  - 材质描述要具体（如哑光黑铁、抛光青铜，不写金属）
  - 描述内容要与脚本中角色表的简版描述一致
  - 全程使用中文，纯文本，不使用表格
